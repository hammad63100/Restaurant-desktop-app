name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Node 22 LTS: matches the version the app is developed and shipped against.
          node-version: 22
          cache: npm

      # better-sqlite3 and bcrypt ship prebuilt N-API binaries, so no compiler is
      # needed. --ignore-scripts keeps installs offline-friendly and fast.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build main process
        run: npm run build:electron

      - name: Run all phase tests
        run: npm run test:all
